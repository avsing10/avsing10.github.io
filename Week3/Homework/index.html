<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 3 Homework</title>
  <style>
    body {
        background-color:aquamarine;
    }
        .card {
            width: 500px;
            height: 750px;
            padding: 36px;
            background-color: white;
            box-sizing: border-box;
        }
        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        .card h1 {
            font-family:Georgia, 'Times New Roman', Times, serif;
            font-size: 32px;
            color: darkgreen;
        }
        .card p {
            font-family:Arial, sans-serif;
            font-size: 16px;
            color: #333333;
        }
        .card button {
            background-color: darkgreen;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
        }
  </style>
</head>
<body>
    <div class="card">
    <img src=".//raccoon.webp" alt="Raccoon">
    <h1>Wrath of the Raccoon</h1>
    <p>Summon up to 4 raccoons with 2d6 hp that can deal 1d4 damage, steal items, and inflict rabies on your enemies.</p>
    <a href="https://www.google.com" target="_blank">
        <button>Learn More</button>
    </a>
    </div>
</body>
</html>
